[package]
name = "palletizing_digital_twin"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", features = ["jpeg", "png", "tonemapping_luts", "zstd_rust"] }
bevy_egui = "0.39"
calamine = "0.36.1"
crossbeam-channel = "0.5"
csv = "1.3"
quick-xml = { version = "0.38", features = ["serialize"] }
regex = "1.11"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
